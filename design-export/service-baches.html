<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bâches & Grand Format — OctoPub Meknès</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', sans-serif; color: #1A1A1A; background: #fff; overflow-x: hidden; }

.reveal       { opacity: 0; transform: translateY(28px); transition: opacity 0.65s cubic-bezier(.16,1,.3,1), transform 0.65s cubic-bezier(.16,1,.3,1); }
.reveal-left  { opacity: 0; transform: translateX(-36px); transition: opacity 0.65s cubic-bezier(.16,1,.3,1), transform 0.65s cubic-bezier(.16,1,.3,1); }
.reveal-right { opacity: 0; transform: translateX(36px);  transition: opacity 0.65s cubic-bezier(.16,1,.3,1), transform 0.65s cubic-bezier(.16,1,.3,1); }
.reveal.visible, .reveal-left.visible, .reveal-right.visible { opacity: 1; transform: none; }

.nav-link { transition: color 0.2s; color: #555; text-decoration: none; }
.nav-link:hover { color: #1D60F1; }
.footer-link { transition: color 0.2s; color: #AAAAAA; text-decoration: none; }
.footer-link:hover { color: #FE5E17; }
.social-icon { transition: border-color 0.2s, color 0.2s; }
.social-icon:hover { border-color: #FE5E17 !important; color: #FE5E17 !important; }
.form-input:focus { outline: none; border-color: #1D60F1 !important; box-shadow: 0 0 0 3px rgba(29,96,241,0.08); }

.spec-card  { transition: border-color 0.22s, transform 0.22s; }
.spec-card:hover  { border-color: #FE5E17 !important; transform: translateY(-3px); }
.price-card { transition: transform 0.22s, box-shadow 0.22s; }
.price-card:hover { transform: translateY(-5px); box-shadow: 0 16px 48px rgba(0,0,0,0.1) !important; }
.gallery-item { transition: transform 0.28s ease; overflow: hidden; cursor: zoom-in; }
.gallery-item:hover { transform: scale(1.02); }
.gallery-item img { transition: transform 0.45s ease; width:100%; height:100%; object-fit:cover; display:block; }
.gallery-item:hover img { transform: scale(1.07); }
.faq-item { border-bottom: 1px solid #E0E0E0; }
.step-dot { transition: all 0.25s; }

@keyframes heroKen { 0%{transform:scale(1)} 100%{transform:scale(1.06)} }
.hero-img { animation: heroKen 10s ease-in-out forwards; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: #f4f4f4; }
::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const C = {
  orange:'#FE5E17', blue:'#1D60F1',
  bgSoft:'#F4F4F4', bgLight:'#E9E9E9', border:'#E0E0E0',
  text:'#1A1A1A', textSec:'#555555', textMuted:'#888888',
  blueLight:'#EEF3FF', dark:'#1A1A1A',
};

// ── SHARED: Logo ────────────────────────────────────────────
function OctoPubLogo({ white=false, size=36 }) {
  const or = white ? '#fff' : '#FE5E17';
  const bl = white ? '#fff' : '#1D60F1';
  const g  = white ? 'og-sp-w' : 'og-sp';
  return (
    <div style={{ display:'flex', alignItems:'center', gap:10 }}>
      <svg width={size} height={size} viewBox="0 0 100 100" fill="none">
        <defs>
          <linearGradient id={g} x1="20" y1="10" x2="80" y2="80" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stopColor={white ? '#fff' : '#FF8C00'} />
            <stop offset="100%" stopColor={white ? 'rgba(255,255,255,0.7)' : '#FE5E17'} />
          </linearGradient>
        </defs>
        <path d="M50 10 C28 10 12 26 12 48 C12 66 24 80 40 84 L40 72 C30 68 24 59 24 48 C24 33 36 22 50 22 C64 22 76 33 76 48 C76 59 70 68 60 72 L60 84 C76 80 88 66 88 48 C88 26 72 10 50 10Z" fill={`url(#${g})`}/>
        <ellipse cx="35" cy="88" rx="5" ry="8" fill={or} transform="rotate(-15 35 88)"/>
        <ellipse cx="44" cy="92" rx="5" ry="8" fill={or}/>
        <ellipse cx="56" cy="92" rx="5" ry="8" fill={or}/>
        <ellipse cx="65" cy="88" rx="5" ry="8" fill={or} transform="rotate(15 65 88)"/>
        <circle cx="50" cy="46" r="10" fill={white ? 'rgba(255,255,255,0.3)' : '#fff'}/>
      </svg>
      <div style={{ fontFamily:"'Outfit',sans-serif", fontWeight:600, fontSize:size*0.55, lineHeight:1 }}>
        <span style={{ color:or }}>Octo</span><span style={{ color:bl }}>Pub</span>
      </div>
    </div>
  );
}

// ── NAVBAR ──────────────────────────────────────────────────
function Navbar({ onDevis }) {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const h = () => setScrolled(window.scrollY > 20);
    window.addEventListener('scroll', h); return () => window.removeEventListener('scroll', h);
  }, []);
  const links = [{label:'Services',href:'index.html#services'},{label:'À propos',href:'index.html#about'},{label:'Réalisations',href:'index.html#portfolio'},{label:'Contact',href:'index.html#contact'}];
  return (
    <nav style={{ position:'fixed',top:0,left:0,right:0,zIndex:1000,background:'#fff',
      borderBottom:`1px solid ${scrolled ? C.border : 'transparent'}`,
      boxShadow:scrolled?'0 2px 20px rgba(0,0,0,0.07)':'none',transition:'all 0.3s',padding:'0 40px'}}>
      <div style={{ maxWidth:1240,margin:'0 auto',display:'flex',alignItems:'center',height:72,gap:32 }}>
        <a href="index.html" style={{ textDecoration:'none',flexShrink:0 }}><OctoPubLogo size={34}/></a>
        <div style={{ flex:1,display:'flex',justifyContent:'center',gap:36 }}>
          {links.map(l=>(
            <a key={l.label} href={l.href} className="nav-link" style={{ fontFamily:'Inter',fontWeight:400,fontSize:15 }}>{l.label}</a>
          ))}
        </div>
        <div style={{ display:'flex',alignItems:'center',gap:20,flexShrink:0 }}>
          <a href="tel:+212663653443" style={{ fontFamily:'Inter',fontSize:14,fontWeight:500,color:C.textSec,textDecoration:'none',display:'flex',alignItems:'center',gap:6 }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={C.orange} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8 19.79 19.79 0 01.22 1.22 2 2 0 012.18 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.14a16 16 0 006.95 6.95l1.41-1.41a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
            +212 663 65 34 43
          </a>
          <button onClick={onDevis} style={{ background:C.orange,color:'#fff',border:'none',borderRadius:6,padding:'10px 22px',fontFamily:'Inter',fontWeight:500,fontSize:14,cursor:'pointer',transition:'opacity 0.2s' }} onMouseEnter={e=>e.target.style.opacity='0.88'} onMouseLeave={e=>e.target.style.opacity='1'}>
            Devis Gratuit
          </button>
        </div>
      </div>
    </nav>
  );
}

// ── 1. HERO ─────────────────────────────────────────────────
function Hero({ onDevis }) {
  return (
    <section style={{ position:'relative', minHeight:'88vh', display:'flex', alignItems:'center', overflow:'hidden', background:'#111' }}>
      <img src="uploads/Impression sur baches.jpg" className="hero-img" alt="Bâches grand format OctoPub"
        style={{ position:'absolute', inset:0, width:'100%', height:'100%', objectFit:'cover',
          filter:'brightness(0.45) saturate(1.2) hue-rotate(-20deg)' }} />
      <div style={{ position:'absolute', inset:0, background:'linear-gradient(110deg, rgba(0,0,0,0.75) 0%, rgba(254,94,23,0.1) 100%)' }} />

      <div style={{ position:'relative', zIndex:2, maxWidth:1240, margin:'0 auto', padding:'120px 40px 80px', width:'100%' }}>
        {/* Breadcrumb */}
        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:28 }}>
          <a href="index.html" style={{ fontFamily:'Inter', fontSize:13, color:'rgba(255,255,255,0.55)', textDecoration:'none', transition:'color 0.2s' }} onMouseEnter={e=>e.target.style.color='#fff'} onMouseLeave={e=>e.target.style.color='rgba(255,255,255,0.55)'}>Accueil</a>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.35)" strokeWidth="2"><path d="M9 18l6-6-6-6"/></svg>
          <a href="index.html#services" style={{ fontFamily:'Inter', fontSize:13, color:'rgba(255,255,255,0.55)', textDecoration:'none', transition:'color 0.2s' }} onMouseEnter={e=>e.target.style.color='#fff'} onMouseLeave={e=>e.target.style.color='rgba(255,255,255,0.55)'}>Services</a>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.35)" strokeWidth="2"><path d="M9 18l6-6-6-6"/></svg>
          <span style={{ fontFamily:'Inter', fontSize:13, color:C.orange }}>Bâches & Grand Format</span>
        </div>

        <div style={{ maxWidth:680 }}>
          <div style={{ display:'inline-flex', alignItems:'center', gap:8, background:'rgba(254,94,23,0.2)', border:'1px solid rgba(254,94,23,0.35)', borderRadius:100, padding:'5px 16px', marginBottom:22 }}>
            <span style={{ fontFamily:'Inter', fontSize:12, fontWeight:500, color:C.orange, letterSpacing:'0.08em', textTransform:'uppercase' }}>Service 01</span>
          </div>
          <h1 style={{ fontFamily:'Outfit', fontWeight:600, fontSize:'clamp(44px,5.5vw,72px)', color:'#fff', lineHeight:1.05, letterSpacing:'-0.02em', marginBottom:24 }}>
            Bâches &<br /><span style={{ color:C.orange }}>Grand Format</span>
          </h1>
          <p style={{ fontFamily:'Inter', fontWeight:300, fontSize:18, color:'rgba(255,255,255,0.72)', lineHeight:1.8, marginBottom:40, maxWidth:520 }}>
            Impression haute définition sur PVC, textile ou papier — pour façades, événements, salons et affichages extérieurs de toutes dimensions.
          </p>
          <div style={{ display:'flex', gap:14, flexWrap:'wrap' }}>
            <button onClick={onDevis} style={{ background:C.orange, color:'#fff', border:'none', borderRadius:8, padding:'16px 34px', fontFamily:'Inter', fontWeight:500, fontSize:15, cursor:'pointer', transition:'all 0.2s', boxShadow:'0 6px 24px rgba(254,94,23,0.4)' }}
              onMouseEnter={e=>{e.target.style.transform='translateY(-2px)';e.target.style.boxShadow='0 12px 32px rgba(254,94,23,0.5)'}}
              onMouseLeave={e=>{e.target.style.transform='';e.target.style.boxShadow='0 6px 24px rgba(254,94,23,0.4)'}}>
              Demander un devis
            </button>
            <a href="#description" style={{ display:'inline-flex', alignItems:'center', gap:8, border:'1.5px solid rgba(255,255,255,0.3)', borderRadius:8, padding:'16px 28px', fontFamily:'Inter', fontWeight:400, fontSize:15, color:'#fff', textDecoration:'none', transition:'all 0.2s' }}
              onMouseEnter={e=>e.currentTarget.style.borderColor='rgba(255,255,255,0.7)'}
              onMouseLeave={e=>e.currentTarget.style.borderColor='rgba(255,255,255,0.3)'}>
              En savoir plus
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
            </a>
          </div>
        </div>

        {/* Quick stats */}
        <div style={{ position:'absolute', right:40, bottom:60, display:'flex', flexDirection:'column', gap:12 }}>
          {[{v:'Sur mesure', l:'toutes dimensions'},{v:'24h', l:'délai express'},{v:'HD', l:'impression 1440 dpi'}].map((s,i) => (
            <div key={i} style={{ background:'rgba(255,255,255,0.1)', backdropFilter:'blur(12px)', border:'1px solid rgba(255,255,255,0.15)', borderRadius:12, padding:'14px 20px', textAlign:'right' }}>
              <div style={{ fontFamily:'Outfit', fontWeight:600, fontSize:20, color: i===1 ? C.orange : '#fff' }}>{s.v}</div>
              <div style={{ fontFamily:'Inter', fontWeight:300, fontSize:11, color:'rgba(255,255,255,0.6)', marginTop:3 }}>{s.l}</div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

// ── 2. DESCRIPTION ──────────────────────────────────────────
function Description() {
  const useCases = [
    { title:'Façades commerciales', desc:'Habillage de devantures, stores et vitrines avec des bâches grand format personnalisées aux couleurs de votre marque.' },
    { title:'Événements & salons', desc:'Backdrops, fonds de scène, banderoles et habillages pour stands de salon, conférences et événements d\'entreprise.' },
    { title:'Affichage publicitaire', desc:'Panneaux publicitaires, bâches de chantier, palissades et supports extérieurs haute résistance aux intempéries.' },
    { title:'Promotions & soldes', desc:'Bâches promotionnelles pour vitrine, entrée de magasin ou parking — rapides à produire, impactantes à l\'œil.' },
  ];
  return (
    <section id="description" style={{ background:'#fff', padding:'100px 40px' }}>
      <div style={{ maxWidth:1240, margin:'0 auto', display:'grid', gridTemplateColumns:'1fr 1fr', gap:80, alignItems:'center' }}>
        <div className="reveal-left">
          <span style={{ fontFamily:'Inter', fontSize:12, fontWeight:500, color:C.orange, textTransform:'uppercase', letterSpacing:'0.12em' }}>Le service</span>
          <h2 style={{ fontFamily:'Outfit', fontWeight:600, fontSize:'clamp(28px,3.5vw,44px)', color:C.text, marginTop:12, marginBottom:20, lineHeight:1.2, letterSpacing:'-0.02em' }}>
            Votre message,<br /><span style={{ fontWeight:300 }}>en grand et en clair</span>
          </h2>
          <p style={{ fontFamily:'Inter', fontWeight:300, fontSize:16, color:C.textSec, lineHeight:1.85, marginBottom:20 }}>
            L'impression sur bâche grand format est la solution la plus visible, la plus économique et la plus rapide pour communiquer à grande échelle. Que ce soit pour 1 m² ou 100 m², OctoPub imprime avec la même exigence de qualité.
          </p>
          <p style={{ fontFamily:'Inter', fontWeight:300, fontSize:16, color:C.textSec, lineHeight:1.85 }}>
            Notre parc machines grand format à Meknès produit des impressions jusqu'à <strong style={{ color:C.text }}>5 mètres de large</strong>, avec une résolution jusqu'à <strong style={{ color:C.text }}>1440 dpi</strong> — couleurs fidèles, finitions nettes, durée de vie garantie.
          </p>
          <div style={{ marginTop:32, display:'flex', gap:16, flexWrap:'wrap' }}>
            {['PVC 510g','PVC 440g','Textile','Papier brillant','Toile','One-Way Vision'].map(m=>(
              <span key={m} style={{ background:C.blueLight, color:C.blue, borderRadius:100, padding:'6px 14px', fontFamily:'Inter', fontSize:13 }}>{m}</span>
            ))}
          </div>
        </div>
        <div className="reveal-right" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
          {useCases.map((u,i) => (
            <div key={i} style={{ background:C.bgSoft, border:`1px solid ${C.border}`, borderRadius:14, padding:'24px 20px' }}>
              <div style={{ width:36, height:36, borderRadius:8, background: i%2===0 ? '#FFF0EA' : C.blueLight, display:'flex', alignItems:'center', justifyContent:'center', marginBottom:14 }}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={i%2===0 ? C.orange : C.blue} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  {i===0 && <><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></>}
                  {i===1 && <><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>}
                  {i===2 && <><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></>}
                  {i===3 && <><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></>}
                </svg>
              </div>
              <h4 style={{ fontFamily:'Outfit', fontWeight:500, fontSize:15, color:C.text, marginBottom:8 }}>{u.title}</h4>
              <p style={{ fontFamily:'Inter', fontWeight:300, fontSize:13, color:C.textSec, lineHeight:1.65 }}>{u.desc}</p>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

// ── 3. SPECS TECHNIQUES ─────────────────────────────────────
function Specs() {
  const specs = [
    { label:'Dimensions max', value:'5 m × ∞', note:'largeur d\'impression maximale', icon:'↔' },
    { label:'Résolution', value:'1440 dpi', note:'impression haute définition', icon:'◎' },
    { label:'Matières', value:'6 types', note:'PVC, textile, papier, toile…', icon:'◈' },
    { label:'Finitions', value:'8 options', note:'ourlet, œillets, entoilage…', icon:'◉' },
    { label:'Délai standard', value:'48h', note:'commande validée', icon:'◷' },
    { label:'Délai express', value:'24h', note:'sur demande, même semaine', icon:'⚡' },
  ];
  const materials = [
    { name:'PVC Frontlit 510g', desc:'Bâche épaisse ultra-résistante, idéale pour l\'extérieur longue durée. Résistance UV, eau, vent.', best:'Façades, palissades, panneaux' },
    { name:'PVC Frontlit 440g', desc:'Version plus légère mais toujours robuste. Rapport qualité-prix optimal pour l\'événementiel.', best:'Stands, salons, promotions' },
    { name:'Mesh / One-Way Vision', desc:'Bâche perforée laissant passer l\'air et la lumière. Parfait pour les vitrines et clôtures.', best:'Vitrines, grillages, barrières' },
    { name:'Textile polyester', desc:'Surface douce et premium pour intérieur. Rendu photographique exceptionnel.', best:'Showrooms, hôtels, restaurants' },
  ];
  return (
    <section style={{ background:C.bgSoft, padding:'100px 40px' }}>
      <div style={{ maxWidth:1240, margin:'0 auto' }}>
        <div className="reveal" style={{ textAlign:'center', marginBottom:64 }}>
          <span style={{ fontFamily:'Inter', fontSize:12, fontWeight:500, color:C.orange, textTransform:'uppercase', letterSpacing:'0.12em' }}>Spécifications</span>
          <h2 style={{ fontFamily:'Outfit', fontWeight:600, fontSize:'clamp(28px,3.5vw,44px)', color:C.text, marginTop:12, letterSpacing:'-0.02em' }}>
            Caractéristiques techniques
          </h2>
        </div>
        {/* Quick specs grid */}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(6,1fr)', gap:16, marginBottom:48 }}>
          {specs.map((s,i) => (
            <div key={i} className="spec-card reveal" style={{ transitionDelay:`${i*0.07}s`, background:'#fff', border:`1px solid ${C.border}`, borderRadius:14, padding:'24px 16px', textAlign:'center' }}>
              <div style={{ fontFamily:'monospace', fontSize:20, color:i%2===0 ? C.orange : C.blue, marginBottom:10 }}>{s.icon}</div>
              <div style={{ fontFamily:'Outfit', fontWeight:600, fontSize:22, color:C.text, marginBottom:4 }}>{s.value}</div>
              <div style={{ fontFamily:'Inter', fontWeight:500, fontSize:12, color:i%2===0 ? C.orange : C.blue, marginBottom:4 }}>{s.label}</div>
              <div style={{ fontFamily:'Inter', fontWeight:300, fontSize:11, color:C.textMuted, lineHeight:1.4 }}>{s.note}</div>
            </div>
          ))}
        </div>
        {/* Materials */}
        <div className="reveal" style={{ marginBottom:8 }}>
          <h3 style={{ fontFamily:'Outfit', fontWeight:500, fontSize:24, color:C.text, marginBottom:24 }}>Matériaux disponibles</h3>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:16 }}>
          {materials.map((m,i) => (
            <div key={i} className="reveal" style={{ transitionDelay:`${i*0.08}s`, background:'#fff', border:`1px solid ${C.border}`, borderRadius:14, padding:'28px 22px' }}>
              <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:14 }}>
                <div style={{ width:10, height:10, borderRadius:'50%', background: i<2 ? C.orange : C.blue, flexShrink:0 }} />
                <span style={{ fontFamily:'Outfit', fontWeight:500, fontSize:15, color:C.text }}>{m.name}</span>
              </div>
              <p style={{ fontFamily:'Inter', fontWeight:300, fontSize:13, color:C.textSec, lineHeight:1.65, marginBottom:14 }}>{m.desc}</p>
              <div style={{ paddingTop:12, borderTop:`1px solid ${C.border}` }}>
                <span style={{ fontFamily:'Inter', fontSize:11, color:C.textMuted }}>Idéal pour : </span>
                <span style={{ fontFamily:'Inter', fontWeight:400, fontSize:11, color:i<2 ? C.orange : C.blue }}>{m.best}</span>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

// ── 4. GALERIE ──────────────────────────────────────────────
function Galerie() {
  const items = [
    { img:'uploads/Impression sur baches.jpg', label:'Bâche façade', filter:'hue-rotate(-30deg) saturate(1.5)', span:2, row:2 },
    { img:'uploads/Impression machines.webp', label:'Atelier grand format', filter:'brightness(0.9)', span:1, row:1 },
    { img:'uploads/Impression Offset & Digital.png', label:'Impression haute définition', filter:'none', span:1, row:1 },
    { img:'uploads/Covering & Stickers.jfif', label:'Habillage vitrine', filter:'none', span:1, row:1 },
    { img:'uploads/Roll-up.jpeg', label:'Kakémono & Roll-up', filter:'none', span:1, row:1 },
  ];
  return (
    <section style={{ background:'#fff', padding:'100px 40px' }}>
      <div style={{ maxWidth:1240, margin:'0 auto' }}>

        <h3 style={{ fontFamily:'Outfit', fontWeight:500, fontSize:20, color:C.text, marginBottom:8 }}>Délai souhaité</h3>
        <div style={{ display:'flex', gap:8, flexWrap:'wrap', marginTop:20 }}>
          {['Urgent < 24h','Standard 48h','1 semaine','Flexible'].map(d=>(
            <button key={d} onClick={()=>setData({...data,delai:d})} style={{ padding:'12px 16px', border:`1.5px solid ${data.delai===d ? C.orange : C.border}`, borderRadius:8, background:data.delai===d?'#FFF0EA':'#fff', fontFamily:'Inter', fontSize:13, color:data.delai===d?C.orange:C.text, cursor:'pointer', transition:'all 0.15s' }}>{d}</button>
          ))}
        </div>
      </div>
    )},
    { content:(
      <div>
        <h3 style={{ fontFamily:'Outfit', fontWeight:500, fontSize:20, color:C.text, marginBottom:20 }}>Vos coordonnées</h3>
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          <div><label style={{ fontFamily:'Inter', fontSize:12, fontWeight:500, color:C.textSec, display:'block', marginBottom:6 }}>Nom</label><input className="form-input" style={{ width:'100%', padding:'12px 14px', border:`1.5px solid ${C.border}`, borderRadius:8, fontFamily:'Inter', fontSize:14, color:C.text, outline:'none' }} placeholder="Votre nom" value={data.nom} onChange={e=>setData({...data,nom:e.target.value})} /></div>
          <div><label style={{ fontFamily:'Inter', fontSize:12, fontWeight:500, color:C.textSec, display:'block', marginBottom:6 }}>Téléphone / WhatsApp</label><input className="form-input" style={{ width:'100%', padding:'12px 14px', border:`1.5px solid ${C.border}`, borderRadius:8, fontFamily:'Inter', fontSize:14, color:C.text, outline:'none' }} placeholder="+212 663 65 34 43" value={data.tel} onChange={e=>setData({...data,tel:e.target.value})} /></div>
        </div>
      </div>
    )},
  ];
  return (
    <div style={{ position:'fixed', inset:0, zIndex:2000, display:'flex', alignItems:'center', justifyContent:'center', background:'rgba(0,0,0,0.45)', backdropFilter:'blur(5px)' }} onClick={onClose}>
      <div style={{ background:'#fff', borderRadius:20, padding:'40px', width:'100%', maxWidth:480, position:'relative', boxShadow:'0 28px 80px rgba(0,0,0,0.2)' }} onClick={e=>e.stopPropagation()}>
        <button onClick={onClose} style={{ position:'absolute', top:16, right:16, width:32, height:32, borderRadius:'50%', border:`1px solid ${C.border}`, background:'#fff', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', color:C.textMuted, fontSize:16 }}>✕</button>
        {!done ? (
          <>
            <div style={{ display:'flex', gap:8, marginBottom:32 }}>
              {steps.map((_,i)=><div key={i} style={{ flex:1, height:3, borderRadius:2, background:i<=step?C.orange:C.bgLight, transition:'background 0.3s' }}/>)}
            </div>
            {steps[step].content}
            <div style={{ display:'flex', justifyContent:'space-between', marginTop:32 }}>
              {step>0 ? <button onClick={()=>setStep(step-1)} style={{ border:`1px solid ${C.border}`, borderRadius:8, padding:'11px 24px', fontFamily:'Inter', fontSize:14, color:C.textSec, background:'#fff', cursor:'pointer' }}>Retour</button> : <div/>}
              {step<steps.length-1
                ? <button onClick={()=>setStep(step+1)} style={{ background:C.orange, color:'#fff', border:'none', borderRadius:8, padding:'11px 28px', fontFamily:'Inter', fontWeight:500, fontSize:14, cursor:'pointer' }}>Continuer</button>
                : <button onClick={()=>setDone(true)} style={{ background:C.orange, color:'#fff', border:'none', borderRadius:8, padding:'11px 28px', fontFamily:'Inter', fontWeight:500, fontSize:14, cursor:'pointer' }}>Envoyer</button>
              }
            </div>
          </>
        ) : (
          <div style={{ textAlign:'center', padding:'20px 0' }}>
            <div style={{ width:64, height:64, borderRadius:'50%', background:'#FFF0EA', display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 20px' }}>
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={C.orange} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <h3 style={{ fontFamily:'Outfit', fontWeight:600, fontSize:22, color:C.text, marginBottom:10 }}>Demande envoyée !</h3>
            <p style={{ fontFamily:'Inter', fontWeight:300, fontSize:15, color:C.textSec, lineHeight:1.7 }}>
              Merci {data.nom || ''} — nous vous revenons dans les 2 heures avec votre devis bâche grand format.
            </p>
            <button onClick={onClose} style={{ marginTop:24, background:C.orange, color:'#fff', border:'none', borderRadius:8, padding:'13px 32px', fontFamily:'Inter', fontWeight:500, fontSize:15, cursor:'pointer' }}>Fermer</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ── APP ─────────────────────────────────────────────────────
function App() {
  const [modal, setModal] = useState(false);
  return (
    <>
      <Navbar onDevis={() => setModal(true)} />
      <Hero    onDevis={() => setModal(true)} />
      <Description />
      <Specs />
      <Galerie />
      <Processus />
      <Tarifs  onDevis={() => setModal(true)} />
      <FAQ />
      <CTAForm />
      <Footer />
      <DevisModal open={modal} onClose={() => setModal(false)} />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
  }, { threshold:0.1, rootMargin:'0px 0px -30px 0px' });
  const go = () => document.querySelectorAll('.reveal,.reveal-left,.reveal-right').forEach(el => io.observe(el));
  setTimeout(go, 300); setTimeout(go, 900); setTimeout(go, 1800);
});
</script>
</body>
</html>
