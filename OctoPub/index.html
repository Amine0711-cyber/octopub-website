<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OctoPub — Votre Image, Notre Mission · Meknès</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', sans-serif; color: #1A1A1A; background: #fff; overflow-x: hidden; }

/* ── SCROLL ANIMATIONS ── */
.reveal { opacity: 0; transform: translateY(32px); transition: opacity 0.7s cubic-bezier(.16,1,.3,1), transform 0.7s cubic-bezier(.16,1,.3,1); }
.reveal.visible { opacity: 1; transform: translateY(0); }
.reveal-left { opacity: 0; transform: translateX(-40px); transition: opacity 0.7s cubic-bezier(.16,1,.3,1), transform 0.7s cubic-bezier(.16,1,.3,1); }
.reveal-left.visible { opacity: 1; transform: translateX(0); }
.reveal-right { opacity: 0; transform: translateX(40px); transition: opacity 0.7s cubic-bezier(.16,1,.3,1), transform 0.7s cubic-bezier(.16,1,.3,1); }
.reveal-right.visible { opacity: 1; transform: translateX(0); }
.reveal-scale { opacity: 0; transform: scale(0.92); transition: opacity 0.6s ease, transform 0.6s ease; }
.reveal-scale.visible { opacity: 1; transform: scale(1); }

/* ── MARQUEE ── */
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.marquee-track { display: flex; animation: marquee 30s linear infinite; white-space: nowrap; }
.marquee-track:hover { animation-play-state: paused; }

/* ── HOVER STATES ── */
.service-card { transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s; cursor: default; }
.service-card:hover { border-color: #FE5E17 !important; box-shadow: 0 12px 40px rgba(254,94,23,0.14) !important; transform: translateY(-5px); }
.service-card .card-img { transition: transform 0.5s ease; overflow: hidden; }
.service-card:hover .card-img img { transform: scale(1.06); }
.service-card .card-img img { transition: transform 0.5s ease; width: 100%; height: 100%; object-fit: cover; display: block; }

.port-overlay { opacity: 0; transition: opacity 0.35s ease; }
.port-card:hover .port-overlay { opacity: 1; }
.port-card { transition: transform 0.28s ease, box-shadow 0.28s ease; cursor: pointer; }
.port-card:hover { transform: translateY(-4px); box-shadow: 0 16px 48px rgba(0,0,0,0.14) !important; }

.step-circle { transition: all 0.25s ease; }
.process-step:hover .step-circle { background: #FE5E17 !important; border-color: #FE5E17 !important; color: #fff !important; }

.nav-link { transition: color 0.2s; color: #555; text-decoration: none; }
.nav-link:hover { color: #1D60F1; }
.footer-link { transition: color 0.2s; color: #AAAAAA; text-decoration: none; }
.footer-link:hover { color: #FE5E17; }
.social-icon { transition: border-color 0.2s, color 0.2s; }
.social-icon:hover { border-color: #FE5E17 !important; color: #FE5E17 !important; }
.form-input:focus { outline: none; border-color: #1D60F1 !important; box-shadow: 0 0 0 3px rgba(29,96,241,0.08); }

/* ── HERO ANIMATED BG ── */
@keyframes heroFloat { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-18px) rotate(2deg); } }
.hero-float { animation: heroFloat 7s ease-in-out infinite; }
@keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
.stat-card { animation: fadeUp 0.6s ease both; }

/* ── HERO IMAGE SLIDER ── */
@keyframes kenBurns { 0%{ transform:scale(1); } 100%{ transform:scale(1.07); } }
.hero-img-active { animation: kenBurns 8s ease-in-out forwards; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: #f4f4f4; }
::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }

/* ── TWEAKS ── */
#tweaks-panel { position: fixed; bottom: 24px; right: 24px; z-index: 9999; background: #fff; border: 1px solid #E0E0E0; border-radius: 12px; padding: 20px; width: 260px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); display: none; }
#tweaks-panel.visible { display: block; }
.tweak-label { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; color: #888; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; display: block; }
.tweak-row { margin-bottom: 14px; }
select.tweak-select { width: 100%; padding: 7px 10px; border: 1px solid #E0E0E0; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 13px; color: #1A1A1A; background: #fff; cursor: pointer; }
</style>
</head>
<body>

<div id="root"></div>

<div id="tweaks-panel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <span style="font-family:'Outfit',sans-serif;font-weight:600;font-size:14px;color:#1A1A1A;">Tweaks</span>
  </div>
  <div class="tweak-row">
    <label class="tweak-label">Densité sections</label>
    <select class="tweak-select" id="tweak-density">
      <option value="comfortable">Confortable (défaut)</option>
      <option value="compact">Compact</option>
      <option value="spacious">Aéré</option>
    </select>
  </div>
  <div class="tweak-row">
    <label class="tweak-label">Radius cartes</label>
    <select class="tweak-select" id="tweak-radius">
      <option value="12">12px (défaut)</option>
      <option value="6">6px — sharp</option>
      <option value="20">20px — soft</option>
    </select>
  </div>
  <div class="tweak-row">
    <label class="tweak-label">Vitesse marquee</label>
    <select class="tweak-select" id="tweak-marquee">
      <option value="30s">Normal</option>
      <option value="18s">Rapide</option>
      <option value="50s">Lent</option>
    </select>
  </div>
</div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const C = {
  orange: '#FE5E17', blue: '#1D60F1',
  bg: '#FFFFFF', bgSoft: '#F4F4F4', bgLight: '#E9E9E9',
  text: '#1A1A1A', textSec: '#555555', textMuted: '#888888',
  border: '#E0E0E0', dark: '#1A1A1A', blueLight: '#EEF3FF',
};

// ── LOGO ────────────────────────────────────────────────────
function OctoPubLogo({ white = false, size = 36 }) {
  const orange = white ? '#fff' : '#FE5E17';
  const blue   = white ? '#fff' : '#1D60F1';
  const gid    = white ? 'og-w' : 'og';
  return (
    <div style={{ display:'flex', alignItems:'center', gap:10 }}>
      <svg width={size} height={size} viewBox="0 0 100 100" fill="none">
        <defs>
          <linearGradient id={gid} x1="20" y1="10" x2="80" y2="80" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stopColor={white ? '#fff' : '#FF8C00'} />
            <stop offset="100%" stopColor={white ? 'rgba(255,255,255,0.7)' : '#FE5E17'} />
          </linearGradient>
        </defs>
        <path d="M50 10 C28 10 12 26 12 48 C12 66 24 80 40 84 L40 72 C30 68 24 59 24 48 C24 33 36 22 50 22 C64 22 76 33 76 48 C76 59 70 68 60 72 L60 84 C76 80 88 66 88 48 C88 26 72 10 50 10Z" fill={`url(#${gid})`} />
        <ellipse cx="35" cy="88" rx="5" ry="8" fill={orange} transform="rotate(-15 35 88)" />
        <ellipse cx="44" cy="92" rx="5" ry="8" fill={orange} />
        <ellipse cx="56" cy="92" rx="5" ry="8" fill={orange} />
        <ellipse cx="65" cy="88" rx="5" ry="8" fill={orange} transform="rotate(15 65 88)" />
        <circle cx="50" cy="46" r="10" fill={white ? 'rgba(255,255,255,0.3)' : '#fff'} />
      </svg>
      <div style={{ fontFamily:"'Outfit',sans-serif", fontWeight:600, fontSize:size*0.55, lineHeight:1 }}>
        <span style={{ color:orange }}>Octo</span><span style={{ color:blue }}>Pub</span>
      </div>
    </div>
  );
}

// ── NAVBAR ───────────────────────────────────────────────────
function Navbar({ onDevis }) {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const h = () => setScrolled(window.scrollY > 20);
    window.addEventListener('scroll', h);
    return () => window.removeEventListener('scroll', h);
  }, []);
  const links = [
    {label:'Services', href:'#services'},
    {label:'À propos', href:'#about'},
    {label:'Réalisations', href:'#portfolio'},
    {label:'Contact', href:'#contact'},
  ];
  return (
    <nav style={{ position:'fixed', top:0, left:0, right:0, zIndex:1000, background:'#fff',
      borderBottom:`1px solid ${scrolled ? C.border : 'transparent'}`,
      boxShadow: scrolled ? '0 2px 20px rgba(0,0,0,0.07)' : 'none',
      transition:'all 0.3s', padding:'0 40px' }}>
      <div style={{ maxWidth:1240, margin:'0 auto', display:'flex', alignItems:'center', height:72, gap:32 }}>
        <a href="#" style={{ textDecoration:'none', flexShrink:0 }}><OctoPubLogo size={34} /></a>
        <div style={{ flex:1, display:'flex', justifyContent:'center', gap:36 }}>
          {links.map(l => (
            <a key={l.label} href={l.href} className="nav-link" style={{ fontFamily:'Inter', fontWeight:400, fontSize:15 }}>{l.label}</a>
          ))}
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:20, flexShrink:0 }}>
          <a href="tel:+212663653443" style={{ fontFamily:'Inter', fontSize:14, fontWeight:500, color:C.textSec, textDecoration:'none', display:'flex', alignItems:'center', gap:6 }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={C.orange} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8 19.79 19.79 0 01.22 1.22 2 2 0 012.18 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.14a16 16 0 006.95 6.95l1.41-1.41a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
            +212 663 65 34 43
          </a>
          <button onClick={onDevis} style={{ background:C.orange, color:'#fff', border:'none', borderRadius:6, padding:'10px 22px', fontFamily:'Inter', fontWeight:500, fontSize:14, cursor:'pointer', transition:'opacity 0.2s' }} onMouseEnter={e=>e.target.style.opacity='0.88'} onMouseLeave={e=>e.target.style.opacity='1'}>
            Devis Gratuit
          </button>
        </div>
      </div>
    </nav>
  );
}

// ── HERO ─────────────────────────────────────────────────────
function Hero({ onDevis }) {
  const [imgIdx, setImgIdx] = useState(0);
  const [animKey, setAnimKey] = useState(0);
  const heroImgs = [
    'uploads/Impression machines.webp',
    'uploads/Impression sur baches.jpg',
    'uploads/Covering Véhicule.jpg',
  ];
  useEffect(() => {
    const t = setInterval(() => {
      setImgIdx(i => (i + 1) % heroImgs.length);
      setAnimKey(k => k + 1);
    }, 6000);
    return () => clearInterval(t);
  }, []);

  const stats = [
    { value:'2500+', label:'Clients satisfaits', color:C.orange },
    { value:'8+',    label:'Années d\'expérience', color:C.blue },
    { value:'24h',   label:'Délai de livraison', color:C.orange },
    { value:'100%',  label:'Satisfaction garantie', color:C.blue },
  ];

  return (
    <section style={{ background:'#0f0f0f', paddingTop:72, minHeight:'100vh', display:'flex', alignItems:'stretch', position:'relative', overflow:'hidden' }}>
      {/* Sliding background images */}
      {heroImgs.map((src, i) => (
        <div key={i} style={{ position:'absolute', inset:0, transition:'opacity 1.2s ease', opacity: i === imgIdx ? 1 : 0 }}>
          <img key={`img-${i}-${animKey}`} src={src} alt="" className={i === imgIdx ? 'hero-img-active' : ''}
            style={{ width:'100%', height:'100%', objectFit:'cover',
              filter: src.includes('baches') ? 'brightness(0.55) saturate(1.3) hue-rotate(-15deg)' : 'brightness(0.45) saturate(1.1)',
            }} />
        </div>
      ))}

      {/* Dark overlay with orange vignette */}
      <div style={{ position:'absolute', inset:0, background:'linear-gradient(105deg, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.38) 60%, rgba(254,94,23,0.12) 100%)' }} />

      {/* Content */}
      <div style={{ position:'relative', zIndex:2, maxWidth:1240, margin:'0 auto', padding:'120px 40px 80px', display:'grid', gridTemplateColumns:'1fr 400px', gap:60, alignItems:'center', width:'100%' }}>
        {/* Left */}
        <div>
          <div style={{ display:'inline-flex', alignItems:'center', gap:8, background:'rgba(255,255,255,0.12)', backdropFilter:'blur(8px)', border:'1px solid rgba(255,255,255,0.18)', borderRadius:100, padding:'6px 16px', marginBottom:28 }}>
            <div style={{ width:7, height:7, borderRadius:'50%', background:C.orange }} />
            <span style={{ fontFamily:'Inter', fontSize:13, fontWeight:400, color:'rgba(255,255,255,0.9)' }}>Impression & Publicité · Meknès, Maroc</span>
          </div>

          <h1 style={{ fontFamily:'Outfit', fontWeight:600, fontSize:'clamp(42px,5vw,70px)', lineHeight:1.08, color:'#fff', letterSpacing:'-0.02em', marginBottom:10, textWrap:'balance' }}>
            L'impression qui<br />
            <span style={{ color:C.orange }}>marque</span> les esprits
          </h1>

          <p style={{ fontFamily:'Outfit', fontWeight:300, fontSize:20, color:'rgba(255,255,255,0.7)', letterSpacing:'0.01em', marginBottom:24 }}>
            Votre Image, Notre Mission
          </p>

          <p style={{ fontFamily:'Inter', fontWeight:300, fontSize:17, color:'rgba(255,255,255,0.65)', lineHeight:1.75, maxWidth:480, marginBottom:40 }}>
            Grand format, enseignes, covering, offset &amp; digital — OctoPub transforme vos idées en supports qui attirent, convainquent et vendent.
          </p>

          <div style={{ display:'flex', gap:14, flexWrap:'wrap' }}>
            <button onClick={onDevis} style={{ background:C.orange, color:'#fff', border:'none', borderRadius:8, padding:'16px 34px', fontFamily:'Inter', fontWeight:500, fontSize:15, cursor:'pointer', transition:'all 0.2s', boxShadow:'0 6px 24px rgba(254,94,23,0.4)' }}
              onMouseEnter={e=>{e.target.style.transform='translateY(-2px)';e.target.style.boxShadow='0 10px 32px rgba(254,94,23,0.5)'}}
              onMouseLeave={e=>{e.target.style.transform='';e.target.style.boxShadow='0 6px 24px rgba(254,94,23,0.4)'}}>
              Demander un devis
            </button>
            <a href="#portfolio" style={{ display:'inline-flex', alignItems:'center', gap:8, border:'1.5px solid rgba(255,255,255,0.35)', borderRadius:8, padding:'16px 28px', fontFamily:'Inter', fontWeight:400, fontSize:15, color:'#fff', textDecoration:'none', transition:'all 0.2s', backdropFilter:'blur(4px)' }}
              onMouseEnter={e=>{e.currentTarget.style.borderColor='rgba(255,255,255,0.7)'}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(255,255,255,0.35)'}}>
              Voir nos réalisations
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </a>
          </div>

          {/* Clients row */}
          <div style={{ marginTop:48, display:'flex', alignItems:'center', gap:20, flexWrap:'wrap' }}>
            <div style={{ display:'flex', gap:10, alignItems:'center', flexWrap:'wrap' }}>
              {[
                { src:'uploads/vALENCIA logo jus.png', name:'Valencia' },
                { src:'uploads/Maroc telecom.jpg', name:'Maroc Telecom' },
                { src:'uploads/Dahab caffe.png', name:'Dahab Café' },
                { src:'uploads/SIAM.png', name:'SIAM' },
              ].map((logo,i) => (
                <div key={i} title={logo.name} style={{ width:52, height:52, borderRadius:10, background:'rgba(255,255,255,0.97)', border:'1.5px solid rgba(255,255,255,0.35)', display:'flex', alignItems:'center', justifyContent:'center', padding:6, boxShadow:'0 2px 12px rgba(0,0,0,0.18)', flexShrink:0, overflow:'hidden' }}>
                  <img src={logo.src} alt={logo.name} style={{ width:'100%', height:'100%', objectFit:'contain', filter:'contrast(1.1) saturate(1.1)' }} />
                </div>
              ))}
            </div>
            <span style={{ fontFamily:'Inter', fontSize:13, color:'rgba(255,255,255,0.7)' }}>Rejoignez <strong style={{ color:'#fff' }}>2500+ entreprises</strong> qui nous font confiance</span>
          </div>
        </div>

        {/* Right — stat cards */}
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14 }}>
          {stats.map((s,i) => (
            <div key={s.label} className="stat-card" style={{ animationDelay:`${i*0.1}s`, background:'rgba(255,255,255,0.1)', backdropFilter:'blur(16px)', borderRadius:16, padding:'28px 20px', border:'1px solid rgba(255,255,255,0.18)', textAlign:'center' }}>
              <div style={{ fontFamily:'Outfit', fontWeight:600, fontSize:40, color:s.color, lineHeight:1 }}>{s.value}</div>
              <div style={{ fontFamily:'Inter', fontWeight:300, fontSize:12, color:'rgba(255,255,255,0.7)', marginTop:8, lineHeight:1.4 }}>{s.label}</div>
            </div>
          ))}
          {/* Slideshow dots */}
          <div style={{ gridColumn:'1/-1', display:'flex', justifyContent:'center', gap:8, paddingTop:8 }}>
            {heroImgs.map((_,i) => (
              <button key={i} onClick={() => { setImgIdx(i); setAnimKey(k=>k+1); }} style={{ width: i===imgIdx ? 24 : 8, height:8, borderRadius:4, background: i===imgIdx ? C.orange : 'rgba(255,255,255,0.3)', border:'none', cursor:'pointer', transition:'all 0.3s', padding:0 }} />
            ))}
          </div>
        </div>
      </div>

      {/* Scroll indicator */}
      <div style={{ position:'absolute', bottom:32, left:'50%', transform:'translateX(-50%)', display:'flex', flexDirection:'column', alignItems:'center', gap:6, zIndex:2 }}>
        <span style={{ fontFamily:'Inter', fontSize:11, color:'rgba(255,255,255,0.45)', letterSpacing:'0.1em', textTransform:'uppercase' }}>Défiler</span>
        <div style={{ width:1, height:36, background:'linear-gradient(to bottom, rgba(255,255,255,0.4), transparent)' }} />
      </div>
    </section>
  );
}

// ── MARQUEE ──────────────────────────────────────────────────
function Marquee() {
  const items = ['Bâches Grand Format','Enseignes Lumineuses','Impression Offset','Covering Véhicule','Bannières Événementielles','Publicité Meta Ads','Roll-up & Kakémonos','Stickers & Adhésifs','PLV & Présentoirs','Flyers & Catalogues'];
  const doubled = [...items, ...items];
  return (
    <div style={{ background:C.bgSoft, borderTop:`1px solid ${C.border}`, borderBottom:`1px solid ${C.border}`, padding:'16px 0', overflow:'hidden' }}>
      <div className="marquee-track">
        {doubled.map((item,i) => (
          <span key={i} style={{ display:'inline-flex', alignItems:'center', gap:20, padding:'0 28px', fontFamily:'Inter', fontWeight:400, fontSize:14, color:C.textMuted, letterSpacing:'0.02em', whiteSpace:'nowrap' }}>
            {item}
            <span style={{ color:C.orange, fontSize:7 }}>◆</span>
          </span>
        ))}
      </div>
    </div>
  );
}

// ── SERVICES ─────────────────────────────────────────────────
const serviceData = [
  { num:'01', title:'Bâches & Grand Format',      desc:'Impressions grand format haute définition pour façades, événements et affichages extérieurs durables.', tags:['Bâches PVC','Banderoles','Kakémonos'], img:'uploads/Impression sur baches.jpg', imgFilter:'hue-rotate(-30deg) saturate(1.6) brightness(0.95)' },
  { num:'02', title:'Enseignes & Signalétique',   desc:'Enseignes lumineuses, lettres découpées, totems et signalétique intérieure professionnelle.', tags:['LED','Plexi','Totems'], img:'uploads/Enseignes & Signalétique.jfif', imgFilter:'none' },
  { num:'03', title:'Impression Offset & Digital', desc:'Flyers, catalogues, cartes de visite et brochures en impression offset ou numérique haute qualité.', tags:['Offset','Digital','Façonnage'], img:'uploads/Impression Offset & Digital.png', imgFilter:'none' },
  { num:'04', title:'Covering & Stickers',        desc:'Habillage complet de véhicules, vitrines et surfaces pour une visibilité maximale.', tags:['Véhicules','Vitrines','Adhésifs'], img:'uploads/Covering & Stickers.jfif', imgFilter:'none' },
  { num:'05', title:'Supports Événementiels',     desc:'Roll-up, stands, backdrops et habillages pour salons, conférences et événements marquants.', tags:['Stands','Roll-up','Backdrop'], img:'uploads/Roll-up.jpeg', imgFilter:'none' },
  { num:'06', title:'Publicité Digitale',         desc:'Campagnes Meta Ads ciblées pour amplifier votre visibilité en ligne à Meknès et au Maroc.', tags:['Meta Ads','Facebook','Instagram'], img:'uploads/Campagnes Meta Ads.jfif', imgFilter:'none' },
];

function Services() {
  return (
    <section id="services" style={{ background:'#fff', padding:'100px 40px' }}>
      <div style={{ maxWidth:1240, margin:'0 auto' }}>
        <div className="reveal" style={{ textAlign:'center', marginBottom:64 }}>
          <span style={{ fontFamily:'Inter', fontSize:12, fontWeight:500, color:C.orange, textTransform:'uppercase', letterSpacing:'0.12em' }}>Nos Services</span>
          <h2 style={{ fontFamily:'Outfit', fontWeight:600, fontSize:'clamp(32px,4vw,48px)', color:C.text, marginTop:12, letterSpacing:'-0.02em' }}>
            Tout ce dont vous avez besoin<br />
            <span style={{ fontWeight:300 }}>pour imprimer votre marque</span>
          </h2>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:24 }}>
          {serviceData.map((c,i) => (
            <div key={i} className={`service-card reveal`} style={{ animationDelay:`${i*0.08}s`, transitionDelay:`${i*0.08}s`, background:'#fff', border:`1px solid ${C.border}`, borderRadius:12, overflow:'hidden' }}>
              {/* Image */}

<script>
// ── INTERSECTION OBSERVER — scroll animations ──────────────
window.addEventListener('DOMContentLoaded', () => {
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

  const observe = () => {
    document.querySelectorAll('.reveal, .reveal-left, .reveal-right, .reveal-scale').forEach(el => io.observe(el));
  };
  // React renders async; retry a few times
  setTimeout(observe, 400);
  setTimeout(observe, 900);
  setTimeout(observe, 1800);
});

// ── TWEAKS ────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "comfortable",
  "cardRadius": "12",
  "marqueeSpeed": "30s"
}/*EDITMODE-END*/;

window.addEventListener('message', (e) => {
  if (e.data?.type === '__activate_edit_mode')   document.getElementById('tweaks-panel').classList.add('visible');
  if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel').classList.remove('visible');
});
window.parent.postMessage({ type: '__edit_mode_available' }, '*');

document.getElementById('tweak-density').addEventListener('change', function() {
  const pad = this.value === 'compact' ? '60px 40px' : this.value === 'spacious' ? '140px 40px' : '100px 40px';
  document.querySelectorAll('section').forEach((s,i) => { if(i>0) s.style.padding = pad; });
  window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ density: this.value }}, '*');
});
document.getElementById('tweak-radius').addEventListener('change', function() {
  document.querySelectorAll('.service-card, .port-card').forEach(el => el.style.borderRadius = this.value + 'px');
  window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ cardRadius: this.value }}, '*');
});
document.getElementById('tweak-marquee').addEventListener('change', function() {
  const t = document.querySelector('.marquee-track');
  if (t) t.style.animationDuration = this.value;
  window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ marqueeSpeed: this.value }}, '*');
});
</script>
